# 示例：Nginx 托管 Vite 构建后的 frontend/dist 静态资源
# 复制到服务器后按实际域名、证书路径、root 修改；与 `vite-plugin-compression` 生成的 .gz/.br 配合使用。
#
# 用法要点：
# - http2 监听 443（需 SSL）
# - gzip / brotli 压缩动态或静态响应；若构建产物旁路已有 .gz/.br，可配合 gzip_static（需 ngx_http_gzip_static_module）

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    root /var/www/investhub/frontend/dist;
    index index.html;

    # SPA：未知路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 优先返回预压缩的静态文件（若 dist 内存在同名 .gz）
    location ~* \.(js|css|svg|json)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 若使用 ngx_brotli 模块，可启用：
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Django 用户上传媒体（settings.MEDIA_ROOT）：生产环境应由 Nginx 直接读盘直出，
    # 避免图片/附件流量经过 Gunicorn。路径须与 Django 的 MEDIA_URL（通常为 /media/）一致。
    # 将 alias 改为服务器上实际 media 目录，例如与 gunicorn 工作目录下的 media/ 同步。
    location /media/ {
        alias /var/www/investhub/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 若需限制类型，可再加：location ~* \.(php|jsp)$ { deny all; }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与 Django 上传限制对齐，避免超大 multipart 占用 worker
        client_max_body_size 15m;
    }
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
