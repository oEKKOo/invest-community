# 示例：Nginx 托管 Vite 构建后的 frontend/dist 静态资源
# 复制到服务器后按实际域名、证书路径、root 修改；与 `vite-plugin-compression` 生成的 .gz/.br 配合使用。
#
# 用法要点：
# - http2 监听 443（需 SSL）
# - gzip / brotli 压缩动态或静态响应；若构建产物旁路已有 .gz/.br，可配合 gzip_static（需 ngx_http_gzip_static_module）

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    root /var/www/investhub/frontend/dist;
    index index.html;

    # SPA：未知路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 优先返回预压缩的静态文件（若 dist 内存在同名 .gz）
    location ~* \.(js|css|svg|json)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 若使用 ngx_brotli 模块，可启用：
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
